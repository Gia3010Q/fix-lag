[package]
name = "mizuauto-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "mizuauto_engine"
path = "../mizuauto-rust/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
